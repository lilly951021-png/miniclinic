<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密碼 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; box-sizing: border-box; }
        h1 { color: #0F2443; text-align: center; margin-top: 0; margin-bottom: 8px; }
        .field { margin: 20px 0; }
        label { display: block; font-weight: bold; color: #0F2443; margin-bottom: 8px; }
        input { width: 100%; padding: 10px; border: 1px solid #E2E8F0; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        button { background: #14B8A6; color: white; padding: 12px 24px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0D9488; }
        .error { background: #FEE2E2; color: #991B1B; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: center; border: 1px solid #FCA5A5; }
        .success { background: #D1FAE5; color: #065F46; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; text-align: center; border: 1px solid #6EE7B7; }
        .back-link { display: block; text-align: center; margin-top: 24px; color: #64748B; text-decoration: none; font-size: 14px; }
        .back-link:hover { color: #0F2443; }
    </style>
</head>
<body>

    <div class="card">
        <h1>修改密碼</h1>
        <p style="text-align: center; color: #64748B; margin-bottom: 24px;">目前醫師：<span th:text="${loggedInDoctorName}" style="font-weight: bold; color: #0F2443;">醫師姓名</span></p>

        <div th:if="${errorMessage}" class="error" th:text="${errorMessage}"></div>
        
        <div th:if="${successMessage}" class="success" th:text="${successMessage}"></div>

        <form th:action="@{/password}" th:object="${passwordForm}" method="post">
            <div class="field">
                <label>舊密碼</label>
                <input type="password" th:field="*{oldPassword}" required placeholder="請輸入目前的密碼">
            </div>

            <div class="field">
                <label>新密碼</label>
                <input type="password" th:field="*{newPassword}" required placeholder="新密碼至少需要 8 碼">
            </div>

            <div class="field">
                <label>確認新密碼</label>
                <input type="password" th:field="*{confirmPassword}" required placeholder="請再次輸入新密碼">
            </div>

            <button type="submit">確認修改密碼</button>
        </form>

        <a class="back-link" th:href="@{/dashboard}">← 返回主控台 (Dashboard)</a>
    </div>

</body>
</html>
