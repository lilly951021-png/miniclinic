<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #14B8A6; padding-bottom: 12px; }
        h1 { color: #0F2443; margin: 0; }
        .header-actions { display: flex; align-items: center; gap: 10px; }
        .btn-change-password { text-decoration: none; background: #0F2443; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        .btn-change-password:hover { background: #1E3A8A; }
        .logout-form { margin: 0; }
        .logout-form button { background: #94A3B8; color: white; padding: 6px 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 24px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
        .status-BOOKED    { color: #F59E0B; font-weight: bold; }
        .status-COMPLETED { color: #10B981; font-weight: bold; }
        .status-CANCELLED { color: #94A3B8; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>Dashboard</h1>
            <p>歡迎，<span th:text="${doctor.name}"></span>（<span th:text="${doctor.department}"></span>）</p>
        </div>
        <div class="header-actions">
            <a th:href="@{/doctor/change-password}" class="btn-change-password">修改密碼</a>
            <form class="logout-form" th:action="@{/logout}" method="post">
                <button type="submit">登出</button>
            </form>
        </div>
    </header>

    <h2 th:text="|今日掛號：${today}|"></h2>

    <p th:if="${appointments.isEmpty()}">今日沒有掛號。</p>

    <table th:unless="${appointments.isEmpty()}">
        <thead>
            <tr>
                <th>時段</th>
                <th>病患</th>
                <th>病歷號</th>
                <th>狀態</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="appt : ${appointments}">
                <td th:text="${appt.timeSlot}">AM</td>
                <td th:text="${appt.patient.name}">測試病患甲</td>
                <td th:text="${appt.patient.chartNo}">TEST00001</td>
                <td>
                    <span th:text="${appt.status}" th:class="${'status-' + appt.status}">BOOKED</span>
                    
                    <button th:if="${appt.status == 'BOOKED'}"
                            th:data-id="${appt.apptId}"
                            onclick="cancelAppointment(this)"
                            style="margin-left: 10px; background-color: #DC2626; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">
                        取消
                    </button>

                    <button th:if="${appt.status == 'BOOKED'}"
                            th:data-id="${appt.apptId}"
                            onclick="completeAppointment(this)"
                            style="margin-left: 6px; background-color: #10B981; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer;">
                        看診完成
                    </button>
                </td> 
            </tr>
        </tbody>
    </table>
     <div style="margin-top: 32px; font-size: 16px; text-align: left;">
        <a href="/" style="color: #0000EE; text-decoration: underline;">← 返回首頁</a>
    </div>
    
    <script>
    // 原有的取消掛號函式
    function cancelAppointment(button) {
        const apptId = button.getAttribute('data-id');
        
        if (confirm('確定要取消這筆掛號嗎？')) {
            fetch(`/api/appointments/${apptId}/status`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: 'CANCELLED' })
            })
            .then(response => {
                if (response.ok) {
                    location.reload();
                } else {
                    alert('取消失敗，你可能沒有權限修改此預約（403）或該預約不存在（404）。');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('連線失敗，請檢查後端伺服器是否正常運作。');
            });
        }
    }

    // ✨ 新增：處理看診完成的函式
    function completeAppointment(button) {
        // 1. 取得綁定在按鈕上的掛號 ID (apptId)
        const apptId = button.getAttribute('data-id');
        
        if (confirm('確定要將此筆掛號標記為「看診完成」嗎？')) {
            // 2. 透過 JavaScript fetch 呼叫後端 API，傳送 COMPLETED
            fetch(`/api/appointments/${apptId}/status`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ status: 'COMPLETED' })
            })
            .then(response => {
                if (response.ok) {
                    // 3. 成功後重新整理頁面，讓狀態重載為 COMPLETED
                    location.reload();
                } else {
                    alert('更新失敗，你可能沒有權限修改此預約（403）或該預約不存在（404）。');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('連線失敗，請檢查後端伺服器是否正常運作。');
            });
        }
    }
    </script>
</body>
</html>
